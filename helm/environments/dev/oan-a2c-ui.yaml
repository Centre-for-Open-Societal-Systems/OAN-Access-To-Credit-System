# Values for the oan-a2c-ui chart (helm/oan-a2c-ui).
# Release `a2c-ui`, namespace `a2c` (shared with the backend service).
#
# Set at install, not here:
# - ui.image.tag: the Jenkins tag `0.0.1-develop.<build>`

ui:
  image:
    # Jenkinsfile ECR_REPO for the develop branch: eoan/oan-a2c-ui/a2c-ui
    # Node IAM role (oan-services-dev-ecr-pull) must allow ecr:BatchGetImage on this repo.
    repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/eoan/oan-a2c-ui/a2c-ui

  env:
    # Read at runtime (src/lib/env.ts), so one image serves every environment.
    API_BASE_URL: https://a2c-service.development.oanstaging.com/api

  ingress:
    enabled: true
    hosts:
    - host: a2c.development.oanstaging.com
